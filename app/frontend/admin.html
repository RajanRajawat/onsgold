<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONS Gold | Admin Portal Unavailable</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ec;
      --panel: rgba(255, 255, 255, 0.92);
      --ink: #1f2937;
      --muted: #5b6472;
      --accent: #b8832f;
      --accent-soft: rgba(184, 131, 47, 0.14);
      --border: rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(184, 131, 47, 0.18), transparent 34%),
        linear-gradient(135deg, #f8f5ef 0%, #efe7dc 100%);
    }

    .notice {
      width: min(100%, 560px);
      padding: 36px 32px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(31, 41, 55, 0.12);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
    }

    .button-primary {
      background: #1d4ed8;
      color: #fff;
    }

    .button-secondary {
      border-color: var(--border);
      color: var(--ink);
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="notice">
    <div class="badge">Admin Portal Unavailable On Web</div>
    <h1>Use the ONS Gold Admin APK</h1>
    <p>The admin portal is not available currently on web. Please contact the admin team and use the Android APK only for product, order, and account management.</p>
    <div class="actions">
      <a class="button button-primary" href="mailto:work4rajan@gmail.com">Contact Admin</a>
      <a class="button button-secondary" href="index.html">Open Storefront</a>
    </div>
  </main>
</body>
</html>
